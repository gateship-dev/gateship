name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.gateship/issues/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  packaging_diff:
    runs-on: ubuntu-latest
    outputs:
      needs_arm64: ${{ steps.diff.outputs.needs_arm64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Detect packaging changes
        id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bun scripts/select-ci-architectures.ts "${BASE_SHA}" "${HEAD_SHA}" >> "$GITHUB_OUTPUT"
      - name: Skip packaging diff for pushes
        id: push-diff
        if: github.event_name != 'pull_request'
        run: GITHUB_EVENT_NAME=push bun scripts/select-ci-architectures.ts >> "$GITHUB_OUTPUT"

  core:
    needs: [packaging_diff]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run core gates
        run: bun run check:all
      - name: Register arm64 emulation
        if: github.event_name == 'pull_request' && needs.packaging_diff.outputs.needs_arm64 == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request'
      - name: Build the amd64 container image
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg GSHIP_BUILD_SHA="${{ github.sha }}" \
            --cache-from type=gha,scope=gateship-ci-linux-amd64 \
            --cache-to type=gha,scope=gateship-ci-linux-amd64,mode=max \
            -t gateship:ci-amd64 --load .
      - name: Build the arm64 container image
        if: github.event_name == 'pull_request' && needs.packaging_diff.outputs.needs_arm64 == 'true'
        run: |
          docker buildx build --platform linux/arm64 \
            --build-arg GSHIP_BUILD_SHA="${{ github.sha }}" \
            --cache-from type=gha,scope=gateship-ci-linux-arm64 \
            --cache-to type=gha,scope=gateship-ci-linux-arm64,mode=max \
            -t gateship:ci-arm64 --load .
      - name: Verify both agent CLIs respond inside the built image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint claude gateship:ci-amd64 --version
          docker run --rm --entrypoint codex gateship:ci-amd64 --version
          if [[ "${{ needs.packaging_diff.outputs.needs_arm64 }}" == true ]]; then
            docker run --rm --entrypoint claude gateship:ci-arm64 --version
            docker run --rm --entrypoint codex gateship:ci-arm64 --version
          fi
      - name: Smoke test the Linux container healthcheck
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker run --rm -d --name gateship-ci -p 127.0.0.1:17777:7777 gateship:ci-amd64
          trap 'docker rm -f gateship-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:17777/api/snapshot >/dev/null; then
              if [[ "$(docker inspect --format '{{.State.Health.Status}}' gateship-ci)" == healthy ]]; then
                exit 0
              fi
            fi
            sleep 1
          done
          docker logs gateship-ci
          exit 1

  ui:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      GSHIP_UI_FIXED_CONTAINER: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        run: npm install --global bun@1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run fixed smoke browser checks
        run: bun run test:ui:smoke:fixed
      - name: Run fixed visual browser checks
        run: bun run test:ui:visual:fixed
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateship-ui-evidence
          path: |
            test-results/ui/
            test-results/ui-report/
            test-results/ui-results.json
          if-no-files-found: ignore
  ci:
    if: always()
    needs: [core, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Require core and UI gates
        run: |
          set -euo pipefail
          test "${{ needs.core.result }}" = success
          test "${{ needs.ui.result }}" = success
